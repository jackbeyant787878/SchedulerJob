name: Deploy SchedulerJobCenter
on:
  workflow_dispatch:   # 手动触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.TENCENT_REGISTRY_USERNAME }}
          password: ${{ secrets.TENCENT_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6   # 升级到 v6，消除 Node 20 警告
        with:
          context: .
          file: ./SchedulerJobCenter/Dockerfile   # 修正为实际路径
          push: true
          tags: |
            ${{ secrets.TENCENT_REGISTRY }}:latest
            ${{ secrets.TENCENT_REGISTRY }}:${{ github.sha }}
          provenance: false
          sbom: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy k8s manifests to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "k8s/*"
          target: "/tmp/scheduler-deploy/"

      - name: Deploy and verify via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /tmp/scheduler-deploy/k8s

            kubectl apply -f scheduler-namespace.yaml

            kubectl delete secret tcr-secret -n scheduler --ignore-not-found
            kubectl create secret docker-registry tcr-secret -n scheduler \
              --docker-server=ccr.ccs.tencentyun.com \
              --docker-username=${{ secrets.TENCENT_REGISTRY_USERNAME }} \
              --docker-password=${{ secrets.TENCENT_REGISTRY_PASSWORD }}

            kubectl create secret generic scheduler-secrets -n scheduler \
              --from-literal=CONNECTIONSTRINGS__DEFAULTCONNECTION="${{ secrets.SQLSERVER_CONNECTIONSTRING }}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl apply -f scheduler-config.yaml

            sed -i "s|image:.*|image: ${{ secrets.TENCENT_REGISTRY }}:${{ github.sha }}|g" scheduler-deployment.yaml
            kubectl apply -f scheduler-deployment.yaml
            kubectl apply -f scheduler-service.yaml

            kubectl rollout status deployment/scheduler-deployment -n scheduler --timeout=3m

            kubectl get pods -n scheduler -o wide
            kubectl get svc -n scheduler
